services:
  app:
    image: ghcr.nju.edu.cn/zuoa/video2any:latest
    ports:
      - "8005:8000"
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/downloads:/data/downloads
      - ./data/outputs:/data/outputs
      - ./data/summaries:/data/summaries
      - ./data/exercises:/data/exercises
      - ./data/models:/data/models
      - ./data/fonts:/data/fonts
      - ./cookies:/data/cookies
    environment:
      DATA_DIR: /data
      BILIBILI_COOKIES_FILE: /data/cookies/bilibili.cookies.txt
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-300}
      SUMMARY_MAX_INPUT_CHARS: ${SUMMARY_MAX_INPUT_CHARS:-9000}
      ASR_BACKEND: ${ASR_BACKEND:-sensevoice}
      ASR_MODEL_SOURCE: ${ASR_MODEL_SOURCE:-modelscope}
      ASR_MODEL_DIR: ${ASR_MODEL_DIR:-/data/models}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-4}
      ASR_SEGMENT_SECONDS: ${ASR_SEGMENT_SECONDS:-25}
      SENSEVOICE_MODEL: ${SENSEVOICE_MODEL:-iic/SenseVoiceSmall}
      QWEN_ASR_MODEL: ${QWEN_ASR_MODEL:-Qwen/Qwen3-ASR-0.6B-hf}
      ASR_VAD_MODEL: ${ASR_VAD_MODEL:-iic/speech_fsmn_vad_zh-cn-16k-common-pytorch}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      EXERCISE_MAX_INPUT_CHARS: ${EXERCISE_MAX_INPUT_CHARS:-9000}
      SITE_URL: ${SITE_URL:-}
