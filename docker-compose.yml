services:
  app:
    image: ghcr.nju.edu.cn/zuoa/video2any:latest
    ports:
      - "8005:8000"
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/downloads:/data/downloads
      - ./data/outputs:/data/outputs
      - ./data/summaries:/data/summaries
      - ./data/exercises:/data/exercises
      - ./data/models:/data/models
      - ./data/fonts:/data/fonts
      - ./cookies:/data/cookies
    environment:
      DATA_DIR: /data
      BILIBILI_COOKIES_FILE: /data/cookies/bilibili.cookies.txt
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-60}
      SUMMARY_MAX_INPUT_CHARS: ${SUMMARY_MAX_INPUT_CHARS:-9000}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      EXERCISE_MAX_INPUT_CHARS: ${EXERCISE_MAX_INPUT_CHARS:-9000}
      SITE_URL: ${SITE_URL:-}
